version: 2
updates:
  # Security updates only: this repo is an export artifact; version bumps come
  # from 577i-unified. A limit of 0 stops version-update PRs while Dependabot
  # security updates keep working.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
  # Restored with the first workflow (.github/workflows/ci.yml); it was dropped
  # in #7 only because Dependabot fails a run when no workflows exist.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
