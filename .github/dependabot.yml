version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # No github-actions ecosystem on purpose: this repo has no workflows, and
  # Dependabot fails the whole run when it cannot find any (2026-09-02).
